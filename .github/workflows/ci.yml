name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: JVM unit tests
    runs-on: ubuntu-latest
    env:
      # ObjectBox 5.2.0 enables build analytics unless this is the literal
      # string "true" (see PR #676, which also sets it in the gradle wrappers).
      OBX_DISABLE_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest

  lint:
    name: Android lint (baseline report)
    runs-on: ubuntu-latest
    env:
      OBX_DISABLE_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # main currently carries ~260 pre-existing error-severity lint findings,
      # so lint is a visible non-gating baseline rather than a failing gate.
      # Tighten this to a failing check once the baseline is cleaned up, and
      # compare PR reports against main before doing so.
      - name: Run lint
        run: ./gradlew lintDebug --continue || true
      - name: Upload lint HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-html
          path: app/build/reports/lint-results-debug.html
      - name: Upload lint text report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-text
          path: app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt

  instrumentation:
    name: Instrumented tests (emulator, API 34)
    runs-on: ubuntu-latest
    env:
      OBX_DISABLE_ANALYTICS: "true"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The emulator registers with adb during boot; if the adb daemon is not
      # running first, the emulator logs "Unable to connect to adb daemon on
      # port: 5037" forever and the runner times out without running any test
      # (seen on the first merges to main). Start the daemon explicitly.
      - name: Start adb server
        run: $ANDROID_HOME/platform-tools/adb start-server
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/outputs/androidTest-results
