name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: JVM unit tests
    runs-on: ubuntu-latest
    env:
      # ObjectBox 5.2.0 enables build analytics unless this is the literal
      # string "true" (see PR #676, which also sets it in the gradle wrappers).
      OBX_DISABLE_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest

  lint:
    name: Android lint (baseline report)
    runs-on: ubuntu-latest
    env:
      OBX_DISABLE_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # main currently carries ~260 pre-existing error-severity lint findings,
      # so lint is a visible non-gating baseline rather than a failing gate.
      # Tighten this to a failing check once the baseline is cleaned up, and
      # compare PR reports against main before doing so.
      - name: Run lint
        run: ./gradlew lintDebug --continue || true
      - name: Upload lint HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-html
          path: app/build/reports/lint-results-debug.html
      - name: Upload lint text report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-text
          path: app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt

  instrumentation:
    name: Instrumented tests (emulator, API 34)
    # Currently NON-GATING: emulator 37.x hangs booting the API 34 image on
    # GitHub runners (u24.04 and u26.04, with working KVM) and the job times
    # out with zero tests executed. The reports still show what ran. Make this
    # gating again once the emulator regression is resolved — the long-term
    # fix under evaluation is moving the pure-JVM-safe auth suites into the
    # unit-test job via the secp256k1 JVM dependency.
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      OBX_DISABLE_ANALYTICS: "true"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The emulator registers with adb during boot; if the adb daemon is not
      # running first, the emulator logs "Unable to connect to adb daemon on
      # port: 5037" forever and the runner times out without running any test
      # (seen on the first merges to main). Start the daemon explicitly.
      - name: Make /dev/kvm accessible
        # /dev/kvm is root:kvm 0660 and the runner user is not in the kvm
        # group; group membership added mid-job does not propagate to later
        # steps, so the udev rule is the reliable way to grant access.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Pin emulator to a stable release
        # Emulator 36.x/37.x dies mid-boot in this configuration (observed
        # locally with 36.6.11 as a SIGSEGV and on CI with 37.2.13 as a silent
        # process exit during API 34 boot). Try known-stable releases in order;
        # the first available package wins and the version is logged.
        run: |
          for v in 34.2.16 33.1.24 32.1.15 31.3.10; do
            echo "trying emulator;$v"
            if $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "emulator;$v"; then
              echo "installed emulator;$v"
              break
            fi
          done
          $ANDROID_HOME/emulator/emulator -version | head -1
      - name: Start adb server
        run: $ANDROID_HOME/platform-tools/adb start-server
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/outputs/androidTest-results
