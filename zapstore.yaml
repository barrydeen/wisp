description: >-
  Zap Cooking is a food-first social experience built around food and
  community. Discover and publish recipes, share food, plan meals, build
  grocery lists, and keep everything organized in My Kitchen. Browse the
  OnlyFood feed, use Nourish for nutrition insights, cook together in groups,
  and message privately with encrypted DMs. Support your favorite cooks with
  Lightning zaps using the built-in Spark wallet or any NWC-compatible wallet.
  Built on open protocols, so your identity, recipes, and relationships can
  move with you.

summary: Cook, share, plan meals, and zap recipes on Nostr

